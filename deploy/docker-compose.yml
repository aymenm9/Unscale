# Production on one small VM (Google Cloud e2-micro, always-free tier).
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
# Needs backend/.env (keys) and DOMAIN in deploy/.env (e.g. 34-12-56-78.sslip.io).
services:
  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: sqlite:////data/ledgerwise.db
      FRONTEND_ORIGIN: https://${DOMAIN}
      PUBLIC_API_URL: https://${DOMAIN}
    volumes:
      - data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on: [backend]
    restart: unless-stopped

  caddy:  # HTTPS with a free Let's Encrypt certificate
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [frontend]
    restart: unless-stopped

volumes:
  data:
  caddy:
