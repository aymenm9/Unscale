# Render Blueprint: the live demo backend (free plan).
# The Next.js frontend runs on Vercel (https://ledgerwise-ai-sdr.vercel.app) and forwards
# /api/* to ledgerwise-api (FastAPI), which uses ledgerwise-db.
# API keys are set in the Render dashboard (sync: false), never in this file.
databases:
  - name: ledgerwise-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: ledgerwise_db_z5it
    user: ledgerwise_db_z5it_user

services:
  - type: web
    name: ledgerwise-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerwise-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://ledgerwise-ai-sdr.vercel.app
      - key: PUBLIC_API_URL
        value: https://ledgerwise-ai-sdr.vercel.app

