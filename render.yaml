# Render Blueprint: the live demo (free plan).
# ledgerwise-app (Next.js) forwards /api/* to ledgerwise-api (FastAPI), which uses ledgerwise-db.
# API keys are set in the Render dashboard (sync: false), never in this file.
databases:
  - name: ledgerwise-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: ledgerwise_db_z5it
    user: ledgerwise_db_z5it_user

services:
  - type: web
    name: ledgerwise-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerwise-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://ledgerwise-app.onrender.com
      - key: PUBLIC_API_URL
        value: https://ledgerwise-app.onrender.com

  - type: web
    name: ledgerwise-app
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: BACKEND_URL
        value: https://ledgerwise-api-ufj4.onrender.com
